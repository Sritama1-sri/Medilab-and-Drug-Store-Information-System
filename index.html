<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediLab - Search and Book Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>MediLab and Drug Store Information System</h1>
        <p>Your Health, Our Priority</p>
    </header>


    <div class="container">

        <h2>Search and Book Test</h2>

        <!-- Search Section -->
        <h3>Search for a Test</h3>

        <input type="text" id="searchInput" placeholder="Enter test name">

        <button onclick="searchTest()">Search</button>


        <!-- Test Results -->
        <h3>Available Tests</h3>

        <div id="testResults">
            <!-- Test details will appear here after Search -->
        </div>


        <!-- Selected Tests -->
        <div id="selectedTests">

            <b>Selected Tests:</b>

            <p>No test selected</p>

        </div>


        <!-- Booking Section -->
        <div class="book-section">

            <h3>Book Your Test</h3>


            <label>Patient Name:</label>
            <br>

            <input type="text"
                   id="patientName"
                   placeholder="Enter your name">

            <br><br>


            <label>Mobile Number:</label>
            <br>

            <input type="text"
                   id="mobile"
                   placeholder="Enter 10 digit mobile number"
                   maxlength="10">

            <br><br>


            <label>Select Date:</label>
            <br>

            <input type="date" id="date">

            <br><br>


            <label>Select Time:</label>
            <br>

            <select id="time">

                <option>Select Time</option>

                <option>9:00 AM</option>
                <option>10:00 AM</option>
                <option>11:00 AM</option>
                <option>12:00 PM</option>
                <option>2:00 PM</option>
                <option>3:00 PM</option>
                <option>4:00 PM</option>

            </select>

            <br><br>


            <button class="book-button" onclick="bookTest()">
                Book Test
            </button>

        </div>

    </div>


    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
